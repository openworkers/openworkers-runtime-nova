[package]
name = "openworkers-runtime-nova"
version = "0.15.0"
edition = "2024"

[dependencies]

# Common types
# openworkers-core = { path = "../openworkers-core" }
openworkers-core = { git = "https://github.com/openworkers/openworkers-core", tag = "v0.15.0" }

# Nova JavaScript engine (pure Rust, data-oriented, MPL-2.0)
# The nova_vm 1.0 defaults minus `temporal`: it pulls temporal_rs 0.1.2, which
# compiles only against icu_calendar 2.1, and v8 152 forces 2.2.1 on any shared
# lockfile. Temporal was never reachable from the guest anyway.
nova_vm = { version = "1.0", default-features = false, features = [
    "math",
    "json",
    "date",
    "array-buffer",
    "shared-array-buffer",
    "weak-refs",
    "atomics",
    "regexp",
    "set",
    "annex-b",
] }

bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5.8"
getrandom = "0.3"

[dev-dependencies]
openworkers-transform = { git = "https://github.com/openworkers/openworkers-transform", tag = "v0.1.0" }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

# nova_vm 1.0.0 does not compile without `temporal`: Intrinsics::temporal* read
# heap constants that only exist under the feature. ../nova-vm carries the seven
# missing cfg attributes; drop the patch once upstream ships them.
[patch.crates-io]
nova_vm = { path = "../nova-vm" }
