[package]
name = "openworkers-runtime-nova"
version = "0.15.3"
edition = "2024"

[dependencies]

# Common types
# openworkers-core = { path = "../openworkers-core" }
openworkers-core = { git = "https://github.com/openworkers/openworkers-core", tag = "v0.15.0" }

# The shared web surface
# openworkers-wintertc = { path = "../openworkers-wintertc" }
openworkers-wintertc = { git = "https://github.com/openworkers/openworkers-wintertc", tag = "v0.1.6" }

# Nova JavaScript engine (pure Rust, data-oriented, MPL-2.0)
# The 1.0.0 release plus the seven cfg attributes Intrinsics::temporal* needs to
# build without the feature; back to crates.io when upstream takes them.
# Dropping `temporal` is what keeps nova_vm out of temporal_rs 0.1.2, which
# compiles only against icu_calendar 2.1, where v8 152 forces 2.2.1 on a shared
# lockfile. Temporal was never reachable from the guest anyway.
nova_vm = { path = "../nova/nova_vm", default-features = false, features = [
    "math",
    "json",
    "date",
    "array-buffer",
    "shared-array-buffer",
    "weak-refs",
    "atomics",
    "regexp",
    "set",
    "annex-b",
] }

bytes = "1"
serde = { version = "1", features = ["derive"] }
# Timers wait on the embedder's reactor rather than blocking its thread
tokio = { version = "1", features = ["time"] }
serde_json = "1"
url = "2.5.8"
getrandom = "0.3"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
# An asset body is arbitrary bytes, and only text crosses into nova
base64 = "0.22"
aes-gcm = "0.10"

[dev-dependencies]
openworkers-transform = { git = "https://github.com/openworkers/openworkers-transform", tag = "v0.1.0" }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
