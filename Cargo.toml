[package]
name = "openworkers-runtime-nova"
version = "0.18.3"
edition = "2024"

[features]
# BindingType::Invoke: env.<NAME>.invoke(command, args) calls a function of the host
invoke = ["openworkers-core/invoke"]

[dependencies]

# Common types
# openworkers-core = { path = "../openworkers-core" }
openworkers-core = { git = "https://github.com/openworkers/openworkers-core", tag = "v0.18.1" }

# The shared web surface
# openworkers-wintertc = { path = "../openworkers-wintertc" }
openworkers-wintertc = { git = "https://github.com/openworkers/openworkers-wintertc", tag = "v0.1.12" }

# Nova JavaScript engine (pure Rust, data-oriented, MPL-2.0)
# The 1.0.0 release plus the seven cfg attributes Intrinsics::temporal* needs to
# build without the feature; back to crates.io when upstream takes them.
# Dropping `temporal` is what keeps nova_vm out of temporal_rs 0.1.2, which
# compiles only against icu_calendar 2.1, where v8 152 forces 2.2.1 on a shared
# lockfile. Temporal was never reachable from the guest anyway.
nova_vm = { git = "https://github.com/openworkers/nova", tag = "v1.0.0-ow.3", default-features = false, features = [
    "math",
    "json",
    "date",
    "array-buffer",
    "shared-array-buffer",
    "weak-refs",
    "atomics",
    "regexp",
    "set",
    "annex-b",
] }

bytes = "1"
serde = { version = "1", features = ["derive"] }
# Timers wait on the embedder's reactor rather than blocking its thread
tokio = { version = "1", features = ["time"] }
serde_json = "1"
url = "2.5.8"
getrandom = "0.4"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
# An asset body is arbitrary bytes, and only text crosses into nova
base64 = "0.23"
aes-gcm = "0.11"
# ECDSA signs a digest the guest layer already computed
p256 = { version = "0.14", features = ["ecdsa"] }
p384 = { version = "0.14", features = ["ecdsa"] }
# The URLPattern grammar; the surface matches with the engine's own RegExp
urlpattern = "0.6"
# The codecs behind CompressionStream
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The legacy encodings a TextDecoder is asked for by label
encoding_rs = "0.8"

[dev-dependencies]
openworkers-transform = { git = "https://github.com/openworkers/openworkers-transform", tag = "v0.1.0" }
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
